<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatórios — Painel Admin Al Muzawad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <div class="app-shell" id="app-shell"></div>

  <script src="../vendor/firebase/firebase-app-compat.js"></script>
<script src="../vendor/firebase/firebase-auth-compat.js"></script>
<script src="../vendor/firebase/firebase-firestore-compat.js"></script>
<script src="../vendor/firebase/firebase-storage-compat.js"></script>
<script src="../firebase-config.js"></script>
<script src="../firebase-init.js"></script>
<script src="js/api.js"></script>
  <script src="js/barra-lateral.js"></script>
  <script src="js/logo-base64.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script>
    let dadosRelatorioActual = null;

    (async () => {
      await exigirSessaoAdmin();

      document.getElementById('app-shell').innerHTML = montarBarraLateral('relatorios') + `
        <main class="conteudo">
          <div class="cabecalho-pagina">
            <div style="display:flex; align-items:center; gap:14px;">
              <img src="assets/icone.png" alt="" style="height:44px; width:44px; object-fit:contain; border-radius:50%;">
              <div>
                <h1>Relatórios de Vendas</h1>
                <p>Estatísticas de vendas, produtos e cidades de entrega</p>
              </div>
            </div>
            <button class="btn btn-primario" id="btn-pdf" disabled>⬇ Descarregar PDF</button>
          </div>

          <div class="painel">
            <div class="painel-titulo"><h2>Filtrar por período</h2></div>
            <div class="grade-form-2">
              <div>
                <label>Data início</label>
                <input type="date" id="data-inicio">
              </div>
              <div>
                <label>Data fim</label>
                <input type="date" id="data-fim">
              </div>
            </div>
            <div style="display:flex; gap:10px; margin-top:16px;">
              <button class="btn btn-primario" id="btn-filtrar">Aplicar filtro</button>
              <button class="btn btn-secundario" id="btn-limpar">Ver tudo</button>
            </div>
          </div>

          <div id="conteudo-relatorio">
            <p class="vazio">A carregar…</p>
          </div>
        </main>
      `;

      document.getElementById('btn-filtrar').addEventListener('click', carregarRelatorio);
      document.getElementById('btn-limpar').addEventListener('click', () => {
        document.getElementById('data-inicio').value = '';
        document.getElementById('data-fim').value = '';
        carregarRelatorio();
      });
      document.getElementById('btn-pdf').addEventListener('click', descarregarPDF);

      carregarRelatorio();
    })();

    async function carregarRelatorio() {
      const container = document.getElementById('conteudo-relatorio');
      const btnPdf = document.getElementById('btn-pdf');
      btnPdf.disabled = true;
      container.innerHTML = `<p class="vazio">A carregar…</p>`;

      try {
        const dataInicio = document.getElementById('data-inicio').value;
        const dataFim = document.getElementById('data-fim').value;
        dadosRelatorioActual = await obterDadosRelatorioVendas(dataInicio, dataFim);
        renderizarRelatorio(dadosRelatorioActual);
        btnPdf.disabled = false;
      } catch (err) {
        container.innerHTML = `<div class="mensagem-erro">${err.message}</div>`;
      }
    }

    function renderizarRelatorio(d) {
      const container = document.getElementById('conteudo-relatorio');
      const r = d.resumo;

      const linhasCidade = d.porCidade.length
        ? d.porCidade.map(c => `<tr><td>${c.cidade}</td><td>${c.encomendas}</td><td>${formatarMT(c.total)}</td></tr>`).join('')
        : `<tr><td colspan="3" class="vazio">Sem dados.</td></tr>`;

      const linhasProduto = d.porProduto.length
        ? d.porProduto.map(p => `<tr><td>${p.nome}</td><td>${p.quantidade}</td><td>${formatarMT(p.total)}</td></tr>`).join('')
        : `<tr><td colspan="3" class="vazio">Sem dados.</td></tr>`;

      const linhasPagamento = d.porPagamento.length
        ? d.porPagamento.map(p => `<tr><td>${p.metodo}</td><td>${p.encomendas}</td><td>${formatarMT(p.total)}</td></tr>`).join('')
        : `<tr><td colspan="3" class="vazio">Sem dados.</td></tr>`;

      const linhasEncomendas = d.encomendas.length
        ? d.encomendas.map(e => `
            <tr>
              <td>${e.codigo}</td>
              <td>${e.cliente_nome || ''}</td>
              <td>${e.cidade_entrega || '—'}</td>
              <td>${formatarMT(e.total)}</td>
              <td><span class="etiqueta ${e.status}">${ROTULOS_STATUS[e.status] || e.status}</span></td>
              <td>${formatarData(e.criado_em)}</td>
            </tr>`).join('')
        : `<tr><td colspan="6" class="vazio">Nenhuma encomenda no período seleccionado.</td></tr>`;

      container.innerHTML = `
        <div class="cartoes-resumo">
          <div class="cartao"><div class="rotulo">Vendas totais</div><div class="valor">${formatarMT(r.totalVendas)}</div></div>
          <div class="cartao"><div class="rotulo">Nº de encomendas</div><div class="valor">${r.numEncomendas}</div></div>
          <div class="cartao"><div class="rotulo">Ticket médio</div><div class="valor">${formatarMT(r.ticketMedio)}</div></div>
          <div class="cartao"><div class="rotulo">Total em entregas</div><div class="valor">${formatarMT(r.totalEntrega)}</div></div>
        </div>

        <div class="painel">
          <div class="painel-titulo"><h2>Vendas por cidade</h2></div>
          <table><tr><th>Cidade</th><th>Encomendas</th><th>Total</th></tr>${linhasCidade}</table>
        </div>

        <div class="painel">
          <div class="painel-titulo"><h2>Produtos mais vendidos</h2></div>
          <table><tr><th>Produto</th><th>Qtd. vendida</th><th>Receita</th></tr>${linhasProduto}</table>
        </div>

        <div class="painel">
          <div class="painel-titulo"><h2>Vendas por método de pagamento</h2></div>
          <table><tr><th>Método</th><th>Encomendas</th><th>Total</th></tr>${linhasPagamento}</table>
        </div>

        <div class="painel">
          <div class="painel-titulo"><h2>Encomendas incluídas (${d.encomendas.length})</h2></div>
          <table><tr><th>Código</th><th>Cliente</th><th>Cidade</th><th>Total</th><th>Estado</th><th>Data</th></tr>${linhasEncomendas}</table>
        </div>
      `;
    }

    function formatarDataSimples(isoDateStr) {
      const [ano, mes, dia] = isoDateStr.split('-');
      return `${dia}/${mes}/${ano}`;
    }

    // Paleta oficial da marca Al Muzawad (RGB)
    const COR_INDIGO = [35, 58, 94];       // #233A5E
    const COR_BARRO = [179, 92, 56];       // #B35C38
    const COR_OLIVEIRA = [112, 123, 74];   // #707B4A
    const COR_AREIA = [237, 228, 207];     // #EDE4CF
    const COR_CREME = [247, 242, 230];     // #F7F2E6
    const COR_CARVAO = [42, 33, 24];       // #2A2118
    const COR_CARVAO_SUAVE = [91, 83, 70]; // #5B5346
    const COR_BORDA = [227, 213, 184];     // #E3D5B8

    function desenharCartaoEstatistica(doc, x, y, largura, altura, rotulo, valor, corAccent) {
      doc.setDrawColor(...COR_BORDA);
      doc.setFillColor(...COR_CREME);
      doc.roundedRect(x, y, largura, altura, 2.2, 2.2, 'FD');

      doc.setFillColor(...corAccent);
      doc.roundedRect(x, y, largura, 2, 2.2, 2.2, 'F');
      doc.rect(x, y + 1, largura, 1.2, 'F'); // esconde o arredondado inferior da barra

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(7.8);
      doc.setTextColor(...COR_CARVAO_SUAVE);
      doc.text(rotulo, x + 5, y + 10, { maxWidth: largura - 10 });

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(13.5);
      doc.setTextColor(...COR_INDIGO);
      doc.text(String(valor), x + 5, y + 19, { maxWidth: largura - 10 });
    }

    function desenharTituloSeccao(doc, x, y, texto, corAccent) {
      doc.setFillColor(...corAccent);
      doc.rect(x, y - 4, 2.4, 6, 'F');
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(11.5);
      doc.setTextColor(...COR_CARVAO);
      doc.text(texto, x + 6, y);
    }

    function desenharCabecalhoSecundario(doc) {
      const largura = doc.internal.pageSize.getWidth();
      doc.setFillColor(...COR_INDIGO);
      doc.rect(0, 0, largura, 14, 'F');
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(9.5);
      doc.setTextColor(...COR_CREME);
      doc.text('AL MUZAWAD', 14, 9);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8.5);
      doc.setTextColor(...COR_AREIA);
      doc.text('Relatório de Vendas', largura - 14, 9, { align: 'right' });
    }

    function desenharRodape(doc, pagina, totalPaginas) {
      const largura = doc.internal.pageSize.getWidth();
      const altura = doc.internal.pageSize.getHeight();
      doc.setDrawColor(...COR_BORDA);
      doc.setLineWidth(0.2);
      doc.line(14, altura - 14, largura - 14, altura - 14);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(7.5);
      doc.setTextColor(...COR_CARVAO_SUAVE);
      doc.text('Al Muzawad — Cosméticos artesanais', 14, altura - 9);
      doc.text(`Página ${pagina} de ${totalPaginas}`, largura - 14, altura - 9, { align: 'right' });
    }

    function descarregarPDF() {
      if (!dadosRelatorioActual) return;
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const d = dadosRelatorioActual;
      const r = d.resumo;
      const largura = doc.internal.pageSize.getWidth();

      const hoje = new Date().toLocaleDateString('pt-PT', { day: '2-digit', month: '2-digit', year: 'numeric' });
      const periodoTexto = (d.periodo.inicio || d.periodo.fim)
        ? `${d.periodo.inicio ? formatarDataSimples(d.periodo.inicio) : 'Início'} a ${d.periodo.fim ? formatarDataSimples(d.periodo.fim) : hoje}`
        : 'Todo o histórico';

      /* ---- Faixa de cabeçalho da marca (página 1) ---- */
      doc.setFillColor(...COR_INDIGO);
      doc.rect(0, 0, largura, 40, 'F');
      doc.setFillColor(...COR_BARRO);
      doc.rect(0, 40, largura, 1.4, 'F');

      if (typeof LOGO_SELO_BASE64 !== 'undefined') {
        doc.addImage(LOGO_SELO_BASE64, 'PNG', 14, 6, 28, 28);
      }

      doc.setFont('times', 'bold');
      doc.setFontSize(19);
      doc.setTextColor(...COR_CREME);
      doc.text('AL MUZAWAD', 48, 20, { charSpace: 0.6 });

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(11);
      doc.setTextColor(...COR_AREIA);
      doc.text('Relatório de Vendas', 48, 28);

      doc.setFontSize(8.5);
      doc.setTextColor(...COR_AREIA);
      doc.text(`Período: ${periodoTexto}`, largura - 14, 16, { align: 'right' });
      doc.text(`Gerado em: ${hoje}`, largura - 14, 22, { align: 'right' });

      let y = 54;

      /* ---- Cartões de resumo ---- */
      const gap = 4;
      const larguraCartao = (largura - 28 - gap * 3) / 4;
      const alturaCartao = 24;
      const cartoes = [
        { rotulo: 'Vendas totais', valor: formatarMT(r.totalVendas), cor: COR_BARRO },
        { rotulo: 'Nº de encomendas', valor: String(r.numEncomendas), cor: COR_OLIVEIRA },
        { rotulo: 'Ticket médio', valor: formatarMT(r.ticketMedio), cor: COR_INDIGO },
        { rotulo: 'Total em entregas', valor: formatarMT(r.totalEntrega), cor: COR_BARRO },
      ];
      cartoes.forEach((c, i) => {
        const x = 14 + i * (larguraCartao + gap);
        desenharCartaoEstatistica(doc, x, y, larguraCartao, alturaCartao, c.rotulo, c.valor, c.cor);
      });
      y += alturaCartao + 14;

      const estiloTabela = {
        theme: 'grid',
        styles: {
          fontSize: 9,
          textColor: COR_CARVAO,
          lineColor: COR_BORDA,
          lineWidth: 0.15,
          cellPadding: 3.2,
        },
        headStyles: {
          fillColor: COR_INDIGO,
          textColor: COR_CREME,
          fontStyle: 'bold',
          fontSize: 9,
        },
        alternateRowStyles: { fillColor: COR_CREME },
        margin: { left: 14, right: 14, top: 22 },
      };

      function novaSeccao(texto, corAccent) {
        if (y > 265) { doc.addPage(); desenharCabecalhoSecundario(doc); y = 24; }
        desenharTituloSeccao(doc, 14, y, texto, corAccent);
        y += 5;
      }

      novaSeccao('Vendas por cidade', COR_BARRO);
      doc.autoTable({
        ...estiloTabela,
        startY: y,
        head: [['Cidade', 'Encomendas', 'Total']],
        body: d.porCidade.length ? d.porCidade.map(c => [c.cidade, String(c.encomendas), formatarMT(c.total)]) : [['Sem dados', '-', '-']],
      });
      y = doc.lastAutoTable.finalY + 12;

      novaSeccao('Produtos mais vendidos', COR_OLIVEIRA);
      doc.autoTable({
        ...estiloTabela,
        startY: y,
        head: [['Produto', 'Qtd. vendida', 'Receita']],
        body: d.porProduto.length ? d.porProduto.map(p => [p.nome, String(p.quantidade), formatarMT(p.total)]) : [['Sem dados', '-', '-']],
      });
      y = doc.lastAutoTable.finalY + 12;

      novaSeccao('Vendas por método de pagamento', COR_INDIGO);
      doc.autoTable({
        ...estiloTabela,
        startY: y,
        head: [['Método', 'Encomendas', 'Total']],
        body: d.porPagamento.length ? d.porPagamento.map(p => [p.metodo, String(p.encomendas), formatarMT(p.total)]) : [['Sem dados', '-', '-']],
      });
      y = doc.lastAutoTable.finalY + 12;

      novaSeccao(`Encomendas incluídas (${d.encomendas.length})`, COR_BARRO);
      doc.autoTable({
        ...estiloTabela,
        startY: y,
        styles: { ...estiloTabela.styles, fontSize: 8 },
        head: [['Código', 'Cliente', 'Cidade', 'Total', 'Estado', 'Data']],
        body: d.encomendas.length ? d.encomendas.map(e => [
          e.codigo,
          e.cliente_nome || '',
          e.cidade_entrega || '—',
          formatarMT(e.total),
          ROTULOS_STATUS[e.status] || e.status,
          formatarData(e.criado_em),
        ]) : [['—', '—', '—', '—', '—', '—']],
      });

      /* ---- Rodapé em todas as páginas ---- */
      const totalPaginas = doc.internal.getNumberOfPages();
      for (let i = 1; i <= totalPaginas; i++) {
        doc.setPage(i);
        desenharRodape(doc, i, totalPaginas);
      }

      const nomeFicheiro = `relatorio-vendas-al-muzawad-${new Date().toISOString().slice(0, 10)}.pdf`;
      doc.save(nomeFicheiro);
    }
  </script>
</body>
</html>
