<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Minha Conta — Al Muzawad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="css/loja.css">
</head>
<body>
  <div id="topo"></div>

  <main class="conteudo" style="padding-top:16px;">
    <h1>Minha conta</h1>
    <div id="conteudo-conta"></div>
  </main>

  <div id="rodape"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="../firebase-config.js"></script>
<script src="../firebase-init.js"></script>
<script src="js/api.js"></script>
  <script src="js/navegacao.js"></script>
  <script>
    document.getElementById('topo').innerHTML = montarTopo('Minha conta');
    document.getElementById('rodape').innerHTML = montarBarraInferior('conta');

    const container = document.getElementById('conteudo-conta');

    (async () => {
      await aguardarAuth();
      if (estaAutenticado()) {
        container.innerHTML = `
          <div class="cartao-pedido">
            <p style="color:#5B5346; font-size:.85rem;">Sessão iniciada como</p>
            <p style="font-weight:700; font-size:1.1rem;">${getNomeCliente() || 'Cliente'}</p>
          </div>
          <button class="btn btn-secundario" style="margin-top:16px;" onclick="sair()">Terminar sessão</button>
        `;
      } else {
        container.innerHTML = `
          <p class="vazio">Entra na tua conta para veres os teus dados e pedidos.</p>
          <a href="login.html" class="btn btn-primario" style="margin-bottom:10px;">Entrar</a>
          <a href="registo.html" class="btn btn-secundario">Criar conta</a>
        `;
      }
    })();

    function sair() {
      limparSessaoCliente();
      window.location.href = 'conta.html';
    }
  </script>
</body>
</html>
