<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Entrar — Al Muzawad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="css/loja.css">
<style>
  .divisor { display: flex; align-items: center; gap: 12px; margin: 22px 0; color: #5B5346; font-size: .82rem; }
  .divisor::before, .divisor::after { content: ''; flex: 1; height: 1px; background: #E3D5B8; }
  .btn-social {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #E3D5B8;
    background: #fff; font-family: 'Archivo', sans-serif; font-size: .92rem; font-weight: 600;
    cursor: pointer; margin-bottom: 10px; color: #2A2118;
  }
  .btn-social img, .btn-social svg { width: 18px; height: 18px; }
  .btn-facebook { background: #1877F2; color: #fff; border-color: #1877F2; }
  #google-botao-real { display: none; } /* botão real do Google, invocado por trás do nosso botão estilizado */
</style>
</head>
<body>
  <main class="conteudo" style="padding-top:50px; max-width:420px;">
    <img src="assets/icone.png" alt="Al Muzawad" style="height:64px; width:64px; object-fit:contain; display:block; margin:0 auto 14px;">
    <h1 style="text-align:center;">Bem-vindo(a)</h1>
    <p style="text-align:center; color:#5B5346; margin-bottom:26px;">Entra na tua conta para continuar</p>

    <button type="button" class="btn-social" id="btn-google">
      <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.6C29.6 35 26.9 36 24 36c-5.2 0-9.7-3.4-11.3-8l-6.6 5.1C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.3-4.2 5.7l6.6 5.6C40.9 36.3 44 30.7 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      Continuar com Google
    </button>

    <button type="button" class="btn-social btn-facebook" id="btn-facebook">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M22 12c0-5.5-4.5-10-10-10S2 6.5 2 12c0 5 3.7 9.1 8.4 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7C18.3 21.1 22 17 22 12z"/></svg>
      Continuar com Facebook
    </button>

    <div class="divisor">ou com email</div>

    <form id="form-login">
      <label>Email</label>
      <input type="email" id="email" required autocomplete="username">

      <label>Senha</label>
      <input type="password" id="senha" required autocomplete="current-password">

      <button type="submit" class="btn btn-primario" style="margin-top:22px;">Entrar</button>
      <div id="mensagem"></div>
    </form>

    <p style="text-align:center; margin-top:20px; color:#5B5346; font-size:.9rem;">
      Ainda não tens conta? <a href="registo.html" style="color:#B35C38; font-weight:600;">Criar conta</a>
    </p>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="../firebase-config.js"></script>
<script src="../firebase-init.js"></script>
<script src="js/api.js"></script>

  <!-- Login com email/senha, Google e Facebook, tudo via Firebase Auth -->
  <script>
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msgDiv = document.getElementById('mensagem');
      try {
        await entrarComEmail(
          document.getElementById('email').value.trim(),
          document.getElementById('senha').value
        );
        irParaProximo();
      } catch (err) {
        msgDiv.innerHTML = `<div class="mensagem-erro">${err.message}</div>`;
      }
    });

    document.getElementById('btn-google').addEventListener('click', async () => {
      try {
        await entrarComGoogle();
        irParaProximo();
      } catch (err) {
        mostrarErroSocial(err.message);
      }
    });

    document.getElementById('btn-facebook').addEventListener('click', async () => {
      try {
        await entrarComFacebook();
        irParaProximo();
      } catch (err) {
        mostrarErroSocial(err.message);
      }
    });

    function irParaProximo() {
      const params = new URLSearchParams(window.location.search);
      window.location.href = params.get('proximo') || 'index.html';
    }

    function mostrarErroSocial(msg) {
      document.getElementById('mensagem').innerHTML = `<div class="mensagem-erro">${msg}</div>`;
    }
  </script>
</body>
</html>
